name: CI
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
    branches: [main]
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check --select E4,E9,F app tests
      - run: pytest -q
      - name: Build Docker image
        run: docker build --tag whappnus-ai-orchestrator:ci .
